name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Add Capacitor and bundle font
        run: |
          npm install
          npm i @fontsource/press-start-2p @capacitor/core @capacitor/android
          npm i -D @capacitor/cli @capacitor/assets
          sed -i '/fonts.googleapis.com\|fonts.gstatic.com/d' index.html
          sed -i '1i import "@fontsource/press-start-2p";' src/main.js
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: |
          echo '{"appId":"com.enlightinginfinity.friendshipquest","appName":"Friendship Quest","webDir":"dist","backgroundColor":"#0d081e"}' > capacitor.config.json
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:screenOrientation="sensorLandscape"/' $M
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&<item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' android/app/src/main/res/values/styles.xml
          mkdir -p assets
          python3 -m pip install --quiet --break-system-packages pillow
          python3 -c "from PIL import Image; im=Image.open('public/assets/icons/icon-512.png').convert('RGBA').resize((1024,1024)); im.save('assets/icon-only.png'); im.save('assets/icon-foreground.png'); Image.new('RGB',(1024,1024),'#1a103c').save('assets/icon-background.png')"
          npx capacitor-assets generate --android || true
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: friendship-quest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
