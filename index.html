<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Friendship Quest — Birthday Adventure</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="A personalized retro platformer birthday adventure game!">
  <meta name="theme-color" content="#1a103c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FriendshipQuest">
  
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Orientation guidance banner for mobile devices in portrait -->
  <div id="orientation-hint">
    <div class="hint-content">
      <span class="rotate-icon">📱 ➔ 📲</span>
      <p>Rotate your phone to <strong>Landscape</strong> for the best birthday adventure experience!</p>
      <button id="dismiss-hint">Play Anyway</button>
    </div>
  </div>

  <div id="game-container"></div>

  <script type="module" src="./src/main.js"></script>
  <script>
    const hint = document.getElementById('orientation-hint');
    const dismissBtn = document.getElementById('dismiss-hint');
    if (dismissBtn) {
      dismissBtn.addEventListener('click', () => {
        hint.style.display = 'none';
      });
    }
  </script>
</body>
</html>
